plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("**/.cache/**") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Ensure IntelliJ launches regenerate ModDev arg files instead of relying on a past Gradle sync.
            taskBefore(tasks.named("prepare${name.capitalize()}Run"))

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

var cleanDatagenCache = tasks.register("cleanDatagenCache", Delete) {
    delete(layout.projectDirectory.dir("src/generated/resources/.cache"))
}

tasks.named("runData") {
    dependsOn cleanDatagenCache
}

// Package entry points must never rely on a developer having run datagen manually.
// runData already depends on classes/processResources, so copy its fresh outputs into
// the processed-resources directory afterwards instead of creating a dependency cycle.
var prepareGeneratedResourcesForPackaging = tasks.register("prepareGeneratedResourcesForPackaging", Copy) {
    dependsOn tasks.named("runData")
    from("src/generated/resources") {
        exclude("**/.cache/**")
    }
    into(layout.buildDirectory.dir("resources/main"))
}

tasks.named("jar") {
    dependsOn prepareGeneratedResourcesForPackaging
}

// When packaging and GameTests share one Gradle invocation, consume the refreshed
// resource directory only after the packaging copy has completed.
tasks.named("runGameTestServer") {
    mustRunAfter prepareGeneratedResourcesForPackaging
    mustRunAfter tasks.named("build")
}

var soundModId = mod_id.toString()
var soundDefinitions = layout.projectDirectory.file("src/generated/resources/assets/${soundModId}/sounds.json")
var soundAssets = layout.projectDirectory.dir("src/main/resources/assets/${mod_id}/sounds")
var soundLang = layout.projectDirectory.dir("src/generated/resources/assets/${mod_id}/lang")
var ambientRegistrySource = layout.projectDirectory.file("src/main/java/com/ohyeah/ohyeahmod/registry/ModSoundEvents.java")
def soundDefinitionsFile = soundDefinitions.asFile
def soundAssetsRoot = soundAssets.asFile
def soundLangRoot = soundLang.asFile
def ambientRegistryFile = ambientRegistrySource.asFile
def soundAssetFiles = fileTree(soundAssetsRoot).matching {
    include "**/*.ogg"
}
var verifySoundAssets = tasks.register("verifySoundAssets") {
    group = "verification"
    description = "Verifies sound definitions, subtitles, and OGG asset bindings."
    dependsOn tasks.named("runData")
    inputs.file(soundDefinitions)
    inputs.dir(soundAssets)
    inputs.files(soundLang.file("en_us.json"), soundLang.file("zh_cn.json"), ambientRegistrySource)

    doLast {
        if (!soundDefinitionsFile.isFile()) {
            throw new GradleException("Missing generated sound definitions: ${soundDefinitionsFile}")
        }

        def parser = new groovy.json.JsonSlurper()
        def definitions = parser.parse(soundDefinitionsFile)
        def errors = []
        def referencedAssets = new LinkedHashSet<String>()
        def subtitleKeys = new LinkedHashSet<String>()

        definitions.each { eventId, definition ->
            if (!(definition instanceof Map)) {
                errors.add("Sound event '${eventId}' does not contain an object definition")
                return
            }
            def entries = definition.sounds
            if (!(entries instanceof List) || entries.isEmpty()) {
                errors.add("Sound event '${eventId}' has no sound entries")
                return
            }
            if (definition.subtitle != null) {
                subtitleKeys.add(definition.subtitle.toString())
            }

            entries.eachWithIndex { entry, index ->
                def name = entry instanceof Map ? entry.name?.toString() : entry?.toString()
                if (name == null || name.isBlank()) {
                    errors.add("Sound event '${eventId}' entry ${index} has no name")
                    return
                }
                if (name.startsWith("${soundModId}:")) {
                    def relativePath = name.substring(soundModId.length() + 1) + ".ogg"
                    referencedAssets.add(relativePath)
                    def asset = new File(soundAssetsRoot, relativePath.replace('/', File.separator))
                    if (!asset.isFile()) {
                        errors.add("Sound event '${eventId}' references missing OGG '${relativePath}'")
                    }
                }
            }
        }

        def actualAssets = soundAssetFiles.files.collect { asset ->
            soundAssetsRoot.toPath().relativize(asset.toPath()).toString().replace(File.separatorChar, '/' as char)
        } as Set
        actualAssets.findAll { !referencedAssets.contains(it) }.sort().each { relativePath ->
            errors.add("Unreferenced OGG asset '${relativePath}'")
        }

        ["en_us", "zh_cn"].each { locale ->
            def languageFile = new File(soundLangRoot, "${locale}.json")
            if (!languageFile.isFile()) {
                errors.add("Missing generated language file '${languageFile}'")
                return
            }
            def language = parser.parse(languageFile)
            subtitleKeys.findAll { !language.containsKey(it) }.sort().each { subtitle ->
                errors.add("Missing ${locale} subtitle '${subtitle}'")
            }
        }

        def ambientPrefix = "tiansuluo_ps.ambient_"
        def ambientKeys = definitions.keySet().findAll { key ->
            key.startsWith(ambientPrefix) && key.substring(ambientPrefix.length()) ==~ /\d{2}/
        }.sort()
        if (!ambientKeys.isEmpty()) {
            def numbers = ambientKeys.collect { key -> key.substring(ambientPrefix.length()).toInteger() }
            def expectedKeys = (1..numbers.size()).collect { index ->
                String.format(java.util.Locale.ROOT, "${ambientPrefix}%02d", index)
            }
            if (ambientKeys != expectedKeys) {
                errors.add("Pink Scarf ambient event IDs must be consecutive from 01: ${ambientKeys}")
            }
        }

        def variantMatcher = ambientRegistryFile.text =~ /TIANSULUO_PS_AMBIENT_VARIANT_COUNT\s*=\s*(\d+)/
        if (variantMatcher.find() && ambientKeys.size() != variantMatcher.group(1).toInteger()) {
            errors.add("Generated Pink Scarf ambient event count ${ambientKeys.size()} differs from registry count ${variantMatcher.group(1)}")
        }

        if (!errors.isEmpty()) {
            throw new GradleException("Sound asset verification failed:\n - ${errors.join('\n - ')}")
        }
        logger.lifecycle("Sound asset verification passed: ${definitions.size()} definitions, ${actualAssets.size()} OGG assets, ${referencedAssets.size()} unique custom references.")
    }
}

var modJar = tasks.named("jar", Jar).flatMap { it.archiveFile }
var requiredJarResources = [
        "assets/ohyeah/sounds.json",
        "assets/ohyeah/sounds/entity/tiansuluo/notice_player_01.ogg",
        "assets/ohyeah/sounds/entity/tiansuluo/luanluan_block_broken_01.ogg",
        "assets/ohyeah/sounds/entity/tiansuluo_pink_scarf/luanluan_block_broken_01.ogg",
        "assets/ohyeah/lang/en_us.json",
        "assets/ohyeah/lang/zh_cn.json",
        "assets/ohyeah/blockstates/tiansuluo_pink_scarf_luanluan_block.json",
        "data/ohyeah/advancement/root.json",
        "data/ohyeah/loot_table/entities/suxia.json",
        "data/ohyeah/neoforge/biome_modifier/suxia_spawn.json",
        "data/ohyeah/structure/empty.nbt",
        "data/ohyeah/recipe/tiansuluo_pink_scarf_luanluan_to_xiami_huhu.json",
        "data/ohyeah/recipe/tiansuluo_pink_scarf_luanluan_to_xiami_huhu_from_smelting.json",
        "data/ohyeah/recipe/tiansuluo_pink_scarf_luanluan_to_xiami_huhu_from_campfire_cooking.json",
        "data/ohyeah/recipe/tiansuluo_battle_face_luanluan_to_xiami_huhu.json",
        "data/ohyeah/recipe/tiansuluo_battle_face_luanluan_to_xiami_huhu_from_smelting.json",
        "data/ohyeah/recipe/tiansuluo_battle_face_luanluan_to_xiami_huhu_from_campfire_cooking.json",
        "data/ohyeah/advancement/recipes/food/tiansuluo_pink_scarf_luanluan_to_xiami_huhu.json",
        "data/ohyeah/advancement/recipes/food/tiansuluo_pink_scarf_luanluan_to_xiami_huhu_from_smelting.json",
        "data/ohyeah/advancement/recipes/food/tiansuluo_pink_scarf_luanluan_to_xiami_huhu_from_campfire_cooking.json",
        "data/ohyeah/advancement/recipes/food/tiansuluo_battle_face_luanluan_to_xiami_huhu.json",
        "data/ohyeah/advancement/recipes/food/tiansuluo_battle_face_luanluan_to_xiami_huhu_from_smelting.json",
        "data/ohyeah/advancement/recipes/food/tiansuluo_battle_face_luanluan_to_xiami_huhu_from_campfire_cooking.json",
]

var verifyJarResources = tasks.register("verifyJarResources") {
    dependsOn tasks.named("jar")
    inputs.file(modJar)

    doLast {
        var missing = []
        new java.util.zip.ZipFile(modJar.get().asFile).withCloseable { zip ->
            requiredJarResources.each { path ->
                if (zip.getEntry(path) == null) {
                    missing.add(path)
                }
            }
            if (zip.stream().anyMatch { entry -> entry.name.startsWith(".cache/") }) {
                throw new GradleException("Datagen cache files must not be packaged in the mod JAR")
            }
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing required generated resources: ${missing.join(', ')}")
        }
    }
}

tasks.named("check") {
    dependsOn verifyJarResources
    dependsOn verifySoundAssets
}

var configuredModVersion = mod_version.toString()
var releaseTag = providers.environmentVariable("GITHUB_REF_NAME").orElse("")

var verifyReleaseMetadata = tasks.register("verifyReleaseMetadata") {
    group = "verification"
    description = "Validates the configured mod version and, in CI, the release tag."
    inputs.property("modVersion", configuredModVersion)
    inputs.property("releaseTag", releaseTag)

    doLast {
        if (!(configuredModVersion ==~ /\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?/)) {
            throw new GradleException("mod_version must be a semantic version, got '${configuredModVersion}'")
        }
        var currentTag = releaseTag.get()
        var expectedTag = "v${configuredModVersion}"
        if (!currentTag.isEmpty() && currentTag != expectedTag) {
            throw new GradleException("Release tag '${currentTag}' must match '${expectedTag}'")
        }
    }
}

tasks.named("build") {
    mustRunAfter verifyReleaseMetadata
}
tasks.named("runGameTestServer") {
    mustRunAfter verifyReleaseMetadata
}

var ciCheck = tasks.register("ciCheck") {
    group = "verification"
    description = "Builds the mod, verifies packaged resources, and runs all GameTests."
    dependsOn tasks.named("build")
    dependsOn tasks.named("runGameTestServer")
}

tasks.register("releaseCheck") {
    group = "verification"
    description = "Runs every validation required before publishing a release."
    dependsOn verifyReleaseMetadata
    dependsOn ciCheck
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri("${project.projectDir}/repo")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
